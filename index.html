<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時空覇王伝 召喚シミュレーター</title>

  <style>
    :root {
      --bg1: #f7f1df;
      --bg2: #eee1bd;
      --panel: rgba(255, 255, 255, 0.94);
      --text: #2f281c;
      --subtext: #776a53;
      --gold1: #d6a62e;
      --gold2: #ffe899;
      --gold3: #9c6d0a;
      --line: #d8c9a3;
      --danger: #a34434;
      --shadow: 0 12px 28px rgba(75, 55, 18, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN",
        "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,.9), transparent 38%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    button {
      font: inherit;
    }

    .app {
      width: min(980px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn .22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero,
    .panel {
      background: var(--panel);
      border: 1px solid rgba(156, 109, 10, .2);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px 22px;
      text-align: center;
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: .04em;
    }

    .hero p {
      margin: 0;
      color: var(--subtext);
    }

    .disclaimer {
      margin: 14px auto 0 !important;
      max-width: 760px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 248, 226, .85);
      border: 1px solid rgba(156, 109, 10, .22);
      color: #66583f !important;
      font-size: 13px;
      line-height: 1.7;
    }

    .panel {
      padding: 22px;
    }

    /* ===== トップ画面 ===== */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .summon-menu-button {
      position: relative;
      min-height: 112px;
      overflow: hidden;
      border: 1px solid #b78d2c;
      border-radius: 16px;
      cursor: pointer;
      color: #3d2e0e;
      background:
        linear-gradient(145deg, rgba(255,255,255,.78), rgba(255,234,165,.75)),
        linear-gradient(135deg, var(--gold2), var(--gold1));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 5px 12px rgba(88, 60, 10, .14);
      transition: transform .15s ease, box-shadow .15s ease;
      padding: 18px;
      text-align: left;
    }

    .summon-menu-button:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 9px 18px rgba(88, 60, 10, .2);
    }

    .summon-menu-button:active {
      transform: translateY(0);
    }

    .summon-menu-button .name {
      display: block;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .summon-menu-button .count {
      display: inline-block;
      font-size: 13px;
      color: #6a4e12;
      background: rgba(255,255,255,.65);
      padding: 4px 9px;
      border-radius: 999px;
    }

    .summon-menu-button.with-image {
      color: white;
      background-position: center;
      background-size: cover;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }

    .summon-menu-button.with-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.1));
      z-index: 0;
    }

    .summon-menu-button.with-image > * {
      position: relative;
      z-index: 1;
    }

    /* ===== 召喚選択画面 ===== */

    .summon-select-shell {
      --accent: #d5a52b;
      --accent-light: #ffe997;
      --accent-dark: #72500d;
      --glow: rgba(223, 176, 58, .55);
      --stage-bg1: #17120b;
      --stage-bg2: #050403;
      max-width: 430px;
      margin: 0 auto;
    }

    .summon-select-shell[data-theme="crimson"] {
      --accent: #cc613e;
      --accent-light: #ffd0a6;
      --accent-dark: #6b241a;
      --glow: rgba(213, 72, 46, .48);
      --stage-bg1: #21100d;
      --stage-bg2: #080302;
    }

    .summon-select-shell[data-theme="violet"] {
      --accent: #a887e6;
      --accent-light: #eee0ff;
      --accent-dark: #4b317e;
      --glow: rgba(150, 103, 229, .48);
      --stage-bg1: #151022;
      --stage-bg2: #050309;
    }

    .select-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .screen-title {
      margin: 0 0 6px;
      font-size: clamp(26px, 4vw, 34px);
      letter-spacing: .04em;
    }

    .screen-subtitle {
      margin: 0;
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.6;
    }

    .banner {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
    }

    .summon-frame {
      position: relative;
      width: min(247px, 100%);
      padding: 10px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, var(--accent-light), var(--accent-dark) 34%, var(--accent) 64%, var(--accent-light));
      box-shadow:
        0 12px 30px rgba(40, 28, 7, .22),
        0 0 24px var(--glow);
      margin: 0 auto 14px;
    }

    .summon-frame::before,
    .summon-frame::after {
      content: "◆";
      position: absolute;
      z-index: 3;
      color: var(--accent-light);
      font-size: 18px;
      text-shadow: 0 0 8px var(--glow);
    }

    .summon-frame::before {
      left: 6px;
      top: 3px;
    }

    .summon-frame::after {
      right: 6px;
      bottom: 3px;
    }

    .summon-visual-button {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 225 / 400;
      border: 1px solid color-mix(in srgb, var(--accent) 65%, white);
      border-radius: 9px;
      overflow: hidden;
      cursor: pointer;
      color: #fff6dc;
      background-color: #050403;
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        inset 0 0 24px rgba(0,0,0,.25);
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      padding: 0;
      isolation: isolate;
    }

    .summon-visual-button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.12),
        0 0 28px var(--glow);
    }

    .summon-visual-button:active:not(:disabled) {
      transform: translateY(1px) scale(.99);
      filter: brightness(1.15);
    }

    .summon-visual-button:disabled {
      cursor: not-allowed;
      opacity: .5;
      filter: grayscale(.35);
    }

    .summon-visual-button::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 39%, rgba(255,255,255,.15) 42%, transparent 46% 100%);
      transform: translateX(-75%);
      transition: transform .42s ease;
    }

    .summon-visual-button:hover:not(:disabled)::after {
      transform: translateX(75%);
    }

    .summon-label {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      width: 88%;
      padding: 8px 5px;
      border-radius: 8px;
      font-weight: 900;
      font-size: clamp(23px, 6vw, 34px);
      letter-spacing: .06em;
      color: #fff8e6;
      background: rgba(0, 0, 0, .20);
      text-shadow:
        0 2px 3px rgba(0,0,0,.95),
        0 0 6px var(--accent),
        0 0 14px var(--glow);
      z-index: 4;
    }

    .summon-hint {
      position: absolute;
      left: 50%;
      bottom: 3.5%;
      transform: translateX(-50%);
      z-index: 4;
      width: 90%;
      color: rgba(255,255,255,.78);
      font-size: 10px;
      letter-spacing: .12em;
      text-shadow: 0 1px 3px #000;
    }


    .summon-cost {
      width: min(300px, 100%);
      margin: 0 auto 15px;
      padding: 8px 12px 10px;
      text-align: center;
      border: 2px solid var(--accent);
      border-radius: 10px;
      color: #fff7d9;
      background:
        linear-gradient(180deg, #211b10, #080704);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 4px 12px rgba(0,0,0,.18),
        0 0 15px color-mix(in srgb, var(--glow) 55%, transparent);
    }

    .summon-cost-label {
      display: block;
      margin-bottom: 2px;
      color: color-mix(in srgb, var(--accent-light) 90%, white);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .summon-cost-value {
      display: block;
      font-family: Georgia, "Times New Roman", "Yu Mincho", "YuMincho", serif;
      font-size: clamp(20px, 5vw, 27px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: .04em;
      text-shadow:
        0 1px 2px #000,
        0 0 8px var(--glow);
    }

    .summon-cost.unset .summon-cost-value {
      font-family: inherit;
      font-size: 14px;
      color: #c9c1b2;
      text-shadow: none;
    }

    .rate-box {
      background:
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(252,248,236,.97));
      border: 1px solid color-mix(in srgb, var(--accent) 55%, #cdbf9a);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 5px 14px rgba(72, 53, 16, .08);
    }

    .rate-heading {
      padding: 9px 12px;
      text-align: center;
      font-weight: 800;
      letter-spacing: .08em;
      color: color-mix(in srgb, var(--accent-dark) 80%, #312710);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--accent-light) 72%, white), color-mix(in srgb, var(--accent) 18%, white));
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, #d8c9a3);
    }

    .rate-list {
      padding: 8px 12px;
    }

    .rate-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px dotted #ddd1b5;
      font-size: 14px;
      line-height: 1.45;
    }

    .rate-row:last-child {
      border-bottom: 0;
    }

    .rate-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .rate-value {
      flex: 0 0 auto;
      font-weight: 800;
      color: color-mix(in srgb, var(--accent-dark) 85%, #312710);
    }

    .rate-total {
      margin: 0;
      padding: 6px 12px 9px;
      text-align: right;
      font-size: 11px;
      color: #8b806a;
    }

    .notice {
      padding: 15px 16px;
      border-radius: 12px;
      background: #fff3ef;
      color: var(--danger);
      border: 1px solid #e6b9ad;
      margin-bottom: 18px;
    }

    /* ===== 共通ボタン ===== */

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    .btn {
      min-width: 150px;
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .12s ease, filter .12s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-primary {
      color: #3f2c05;
      background: linear-gradient(180deg, #fff0a8, #d7a12a);
      border: 1px solid #a87812;
      box-shadow: 0 4px 10px rgba(100, 67, 8, .18);
    }

    .btn-secondary {
      color: #4a4337;
      background: #eee9dd;
      border: 1px solid #cfc5ae;
    }

    /* ===== 結果画面 ===== */

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .result-card {
      padding: 15px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #dfd4b9;
      box-shadow: 0 5px 12px rgba(70, 50, 15, .08);
    }

    .result-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 10px;
      background: #f7f3e9;
    }

    .result-number {
      font-size: 12px;
      color: #8a7d63;
      margin-bottom: 6px;
    }

    .result-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .result-rate {
      color: #765815;
      font-size: 14px;
    }

    .summary {
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      margin: 6px 0 0;
    }

    .single-result-animate {
      animation: singleSummonReveal .48s ease-out;
    }

    @keyframes singleSummonReveal {
      0% {
        opacity: .15;
        transform: scale(.96);
        filter: brightness(1.35);
      }
      55% {
        opacity: 1;
        transform: scale(1.02);
        filter: brightness(1.08);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen.active,
      .single-result-animate {
        animation: none;
      }

      .summon-visual-button,
      .summon-visual-button::after {
        transition: none;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 16px, 980px);
        padding-top: 12px;
      }

      .hero,
      .panel {
        border-radius: 15px;
      }

      .hero {
        padding: 20px 14px;
      }

      .panel {
        padding: 15px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .summon-menu-button {
        min-height: 92px;
      }

      .summon-select-shell {
        max-width: 100%;
      }

      .summon-frame {
        width: min(247px, 100%);
      }

      .button-row {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .result-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 410px) {
      .result-grid {
        grid-template-columns: 1fr;
      }

      .rate-row {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- ① トップ画面 -->
    <section id="topScreen" class="screen active">
      <div class="hero">
        <h1>時空覇王伝 召喚シミュレーター</h1>
        <p>引きたい召喚を選択してください。</p>
        <p class="disclaimer">非公式の召喚シミュレーターです。実際のゲーム内での召喚結果を保証するものではありません。</p>
      </div>

      <div class="panel">
        <div id="summonMenu" class="menu-grid"></div>
      </div>
    </section>

    <!-- ② 召喚選択画面 -->
    <section id="selectScreen" class="screen">
      <div class="panel">
        <div id="summonSelectShell" class="summon-select-shell" data-theme="gold">
          <img id="selectBanner" class="banner" alt="召喚バナー">

          <div class="select-header">
            <h2 id="selectTitle" class="screen-title"></h2>
            <p id="selectSubtitle" class="screen-subtitle"></p>
          </div>

          <!-- 元ゲームの「縦長の召喚画像を押す」感覚をCSSで表現 -->
          <div class="summon-frame">
            <button id="summonButton" class="summon-visual-button" type="button">
              <span id="summonButtonText" class="summon-label">召喚する</span>
              <span class="summon-hint">CLICK TO SUMMON</span>
            </button>
          </div>

          <!-- 召喚画像と出現一覧の間に消費量を目立たせて表示 -->
          <div id="summonCost" class="summon-cost">
            <span class="summon-cost-label">必要数</span>
            <span id="summonCostValue" class="summon-cost-value"></span>
          </div>

          <!-- 召喚画像の下に小さく出現確率を表示 -->
          <div id="rateArea"></div>

          <div class="button-row">
            <button id="backToTopButton" class="btn btn-secondary" type="button">
              召喚選択に戻る
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ③ 召喚結果画面 -->
    <section id="resultScreen" class="screen">
      <div id="resultPanel" class="panel">
        <h2 id="resultTitle" class="screen-title">召喚結果</h2>
        <p id="resultSummary" class="summary"></p>

        <div id="resultGrid" class="result-grid"></div>

        <div class="button-row">
          <button id="retryButton" class="btn btn-primary" type="button">
            もう一度引く
          </button>

          <button id="resultBackButton" class="btn btn-secondary" type="button">
            召喚選択に戻る
          </button>
        </div>
      </div>
    </section>

  </main>

  <script>
    /*
      ============================================================
      ここを編集すれば、召喚の追加・確率変更・画像設定ができます。
      ============================================================
    */

    // カード画像を用意した場合は image: "images/iron.png" のように設定。
    const pools = {
      gold: {

    /*
      トップ画面に並ぶ召喚メニュー。
      今後召喚を増やす場合も、基本的にはここに1行追加すればOKです。
    */
    const summonMenus = [
      { id: "gold1",       label: "金召喚",         poolId: "gold",        count: 1,  costText: "300DC",          menuImage: "" },
      { id: "gold10",      label: "金召喚×10連",   poolId: "gold",        count: 10, costText: "3,000DC",        menuImage: "" },
      { id: "special1",    label: "特金",           poolId: "specialGold", count: 1,  costText: "特金券1枚",      menuImage: "" },
      { id: "special10",   label: "特金×10連",     poolId: "specialGold", count: 10, costText: "特金券10枚",     menuImage: "" },
      { id: "champion1",   label: "覇者召喚",       poolId: "champion",    count: 1,  costText: "王者券3枚",      menuImage: "" },
      { id: "champion10",  label: "覇者召喚×10連", poolId: "champion",    count: 10, costText: "王者券30枚",     menuImage: "" }
    ];

    /*
      ============================================================
      ここから下は基本的に変更不要です。
      ============================================================
    */

    const topScreen = document.getElementById("topScreen");
    const selectScreen = document.getElementById("selectScreen");
    const resultScreen = document.getElementById("resultScreen");

    const summonMenu = document.getElementById("summonMenu");

    const summonSelectShell = document.getElementById("summonSelectShell");
    const selectBanner = document.getElementById("selectBanner");
    const selectTitle = document.getElementById("selectTitle");
    const selectSubtitle = document.getElementById("selectSubtitle");
    const rateArea = document.getElementById("rateArea");
    const summonButton = document.getElementById("summonButton");
    const summonButtonText = document.getElementById("summonButtonText");
    const summonCost = document.getElementById("summonCost");
    const summonCostValue = document.getElementById("summonCostValue");

    const resultTitle = document.getElementById("resultTitle");
    const resultSummary = document.getElementById("resultSummary");
    const resultGrid = document.getElementById("resultGrid");
    const resultPanel = document.getElementById("resultPanel");

    const backToTopButton = document.getElementById("backToTopButton");
    const retryButton = document.getElementById("retryButton");
    const resultBackButton = document.getElementById("resultBackButton");

    let currentMenu = null;

    // 画面切り替え
    function showScreen(screen) {
      [topScreen, selectScreen, resultScreen].forEach(el => {
        el.classList.remove("active");
      });

      screen.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // トップ画面の召喚ボタンを生成
    function buildTopMenu() {
      summonMenu.innerHTML = "";

      summonMenus.forEach(menu => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "summon-menu-button";

        if (menu.menuImage) {
          button.classList.add("with-image");
          button.style.backgroundImage = `url("${menu.menuImage}")`;
        }

        button.innerHTML = `
          <span class="name">${escapeHtml(menu.label)}</span>
          <span class="count">${menu.count === 1 ? "1回召喚" : menu.count + "回連続召喚"}</span>
        `;

        button.addEventListener("click", () => openSummonSelect(menu.id));
        summonMenu.appendChild(button);
      });
    }

    // 召喚選択画面を開く
    function openSummonSelect(menuId) {
      currentMenu = summonMenus.find(menu => menu.id === menuId);

      if (!currentMenu) return;

      const pool = pools[currentMenu.poolId];

      selectTitle.textContent = currentMenu.label;
      selectSubtitle.textContent =
        currentMenu.count === 1
          ? "下の召喚エリアを押すと召喚を実行します。"
          : `下の召喚エリアを押すと${currentMenu.count}回連続で召喚します。`;

      // 召喚ごとに色味を切り替える
      summonSelectShell.dataset.theme = pool?.theme || "gold";

      // 用意した縦長の召喚画像をクリック領域の背景として表示
      if (pool && pool.summonImage) {
        summonButton.style.backgroundImage = `url("${pool.summonImage}")`;
      } else {
        summonButton.style.backgroundImage = "none";
      }

      // 召喚に必要なDCまたは召喚券の枚数を画像下に表示
      if (currentMenu.costText) {
        summonCost.classList.remove("unset");
        summonCostValue.textContent = currentMenu.costText;
      } else {
        summonCost.classList.add("unset");
        summonCostValue.textContent = "消費量未設定";
      }

      // バナー画像を設定している場合のみ表示
      if (pool && pool.bannerImage) {
        selectBanner.src = pool.bannerImage;
        selectBanner.style.display = "block";
      } else {
        selectBanner.removeAttribute("src");
        selectBanner.style.display = "none";
      }

      renderRates(pool);

      const usable = pool && Array.isArray(pool.items) && pool.items.length > 0;
      summonButton.disabled = !usable;

      summonButtonText.textContent =
        currentMenu.count === 1
          ? "召喚する"
          : `${currentMenu.count}連召喚する`;

      summonButton.setAttribute(
        "aria-label",
        currentMenu.count === 1
          ? `${currentMenu.label}を召喚する`
          : `${currentMenu.label}を${currentMenu.count}連召喚する`
      );

      showScreen(selectScreen);
    }

    // 出現確率一覧の表示
    function renderRates(pool) {
      if (!pool || !Array.isArray(pool.items) || pool.items.length === 0) {
        rateArea.innerHTML = `
          <div class="notice">
            この召喚の確率データはまだ設定されていません。
            JavaScript内の pools に確率を追加すると使用できます。
          </div>
        `;
        return;
      }

      const total = pool.items.reduce((sum, item) => sum + item.rate, 0);

      const rows = pool.items.map(item => `
        <div class="rate-row">
          <span class="rate-name">${escapeHtml(item.name)}</span>
          <span class="rate-value">${formatRate(item.rate)}%</span>
        </div>
      `).join("");

      rateArea.innerHTML = `
        <div class="rate-box">
          <div class="rate-heading">出現一覧</div>
          <div class="rate-list">
            ${rows}
          </div>
          <p class="rate-total">確率合計 ${formatRate(total)}%</p>
        </div>
      `;
    }

    // 召喚実行
    function runSummon() {
      if (!currentMenu) return;

      const pool = pools[currentMenu.poolId];

      if (!pool || !Array.isArray(pool.items) || pool.items.length === 0) {
        return;
      }

      const results = [];

      for (let i = 0; i < currentMenu.count; i++) {
        results.push(drawWeighted(pool.items));
      }

      showResults(results);
    }

    // 重み付き抽選
    function drawWeighted(items) {
      const total = items.reduce((sum, item) => sum + item.rate, 0);

      let random01;

      if (window.crypto && window.crypto.getRandomValues) {
        const values = new Uint32Array(1);
        window.crypto.getRandomValues(values);
        random01 = values[0] / 4294967296;
      } else {
        random01 = Math.random();
      }

      let point = random01 * total;

      for (const item of items) {
        point -= item.rate;

        if (point < 0) {
          return item;
        }
      }

      // 浮動小数点誤差対策
      return items[items.length - 1];
    }

    // 結果画面
    function showResults(results) {
      resultTitle.textContent = `${currentMenu.label} 結果`;

      if (results.length === 1) {
        const item = results[0];
        resultSummary.textContent =
          `${item.name}: ${formatRate(item.rate)}% が召喚されました`;
      } else {
        resultSummary.textContent =
          `${results.length}回の召喚結果`;
      }

      resultGrid.innerHTML = "";

      results.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "result-card";

        const imageHtml = item.image
          ? `<img src="${escapeAttribute(item.image)}" alt="${escapeAttribute(item.name)}">`
          : "";

        card.innerHTML = `
          ${imageHtml}
          <div class="result-number">RESULT ${index + 1}</div>
          <div class="result-name">${escapeHtml(item.name)}</div>
          <div class="result-rate">排出確率 ${formatRate(item.rate)}%</div>
        `;

        resultGrid.appendChild(card);
      });

      showScreen(resultScreen);

      // 単発召喚は、前回と同じ結果でも引き直したことが分かるよう軽く再表示。
      // 10連召喚ではこの演出を付けない。
      resultPanel.classList.remove("single-result-animate");

      if (results.length === 1) {
        void resultPanel.offsetWidth;
        resultPanel.classList.add("single-result-animate");
      }
    }

    function formatRate(rate) {
      return Number.isInteger(rate)
        ? String(rate)
        : String(rate).replace(/0+$/, "").replace(/\.$/, "");
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text);
    }

    summonButton.addEventListener("click", runSummon);

    backToTopButton.addEventListener("click", () => {
      showScreen(topScreen);
    });

    resultBackButton.addEventListener("click", () => {
      showScreen(topScreen);
    });

    retryButton.addEventListener("click", () => {
      if (currentMenu) {
        runSummon();
      }
    });

    buildTopMenu();
  </script>
</body>
</html>
